name: Release Rehearsal

# Read-only publication rehearsal (issue #9). This workflow never creates,
# moves, or deletes a tag/ref/GitHub release, never uploads an artifact,
# and never mutates any protected environment or repository state. It
# exists to mechanically prove, on every pull request, that the release
# rehearsal tooling runs and truthfully reports the current candidate's
# eligibility -- which today is, and is expected to remain, BLOCKED (see
# docs/release_process.md's "Legal and provenance boundary"). Publication
# itself requires a separate, later, explicitly-authorized write-capable
# workflow that does not exist in this repository.
#
# This workflow's own permission/safety contract is itself mechanically
# checked below (scripts/release_rehearsal/workflow_guard.py, via
# `make release-workflow-guard`) -- both in CI, and by
# scripts/release_rehearsal/tests/test_workflow_guard.py's
# `RepositoryStateTests.test_real_release_rehearsal_workflow_is_clean`.
on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # issue #9 mandatory correction (exact target-SHA binding): every
    # publication-eligibility/rehearsal step below (via release.mk's own
    # `RELEASE_TARGET_SHA ?= $(shell git rev-parse HEAD)` default) binds
    # to this exact, immutable, checked-out commit -- never an
    # independently-resolved value that could theoretically disagree
    # with the checkout step above. Mechanically cross-checked by
    # scripts/release_rehearsal/workflow_guard.py's own
    # `check_release_target_sha_binding` (via `make release-workflow-
    # guard`), which fails closed if this binding is ever removed while
    # a release-check/release-rehearse step remains.
    env:
      RELEASE_TARGET_SHA: ${{ github.sha }}

    steps:
      # Pinned to an immutable, independently-verified 40-lowercase-hex commit SHA
      # (issue #9 mandatory correction #1) -- never a mutable tag/branch. See
      # docs/release_data/action_pins.json for the exact upstream source/version
      # this SHA corresponds to, how that was verified, and the update procedure;
      # scripts/release_rehearsal/action_pins.py mechanically cross-checks this
      # line against that inventory (via `make release-workflow-guard`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Run release rehearsal stdlib test suites
        run: |
          python3 -m unittest discover -s scripts/release_rehearsal/tests -v
          python3 -m unittest discover -s scripts/modernize/migrations/tests -v

      - name: Validate this workflow's own permission/safety contract (dynamic machine JSON)
        run: make release-workflow-guard

      - name: Run release migrations registry check
        run: make release-migrations-check

      - name: Run stale save-compatibility-epoch claim regression check
        run: make release-epoch-claims-check

      - name: Run stale aggregate-test-count claim regression check
        run: make release-stale-count-claims-check

      - name: Run deterministic archive + rebuild rehearsal
        run: make release-rehearse

      - name: Run release eligibility check (current tree is expected BLOCKED)
        run: make release-check

      - name: Mechanically assert the current expected status is BLOCKED
        run: make release-check-expect-blocked

      - name: Job summary (rendered dynamically from canonical JSON -- never hardcoded)
        if: always()
        run: python3 -m scripts.release_rehearsal.cli summary --target-sha "$RELEASE_TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
