name: Build CI

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Runs against the immutable commit CI is building (not the mutable
    # worktree/index) and before Install dependencies/Build tools create any
    # build output, so a prohibited tracked artifact fails fast on Git object
    # content instead of being masked by later build products.
    - name: Check tracked artifacts
      run: python3 scripts/artifact_guard.py --revision HEAD

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev gcc-arm-none-eabi libnewlib-arm-none-eabi libmgba-dev && python -m pip install ttp numpy pillow

    - name: Build tools
      run: ./build_tools.sh

    # Generated-data platform (Issue #5 Chapter 2 slice, Batch C): validates
    # every registered table's JSON source, cross-table references, the
    # whole-bundle chapter manifest, and committed inventory drift. Pure
    # Python/stdlib, no generated C is linked here -- runs once, before the
    # target-ROM linker gate below, so a stale/inconsistent data source
    # fails fast with actionable file:line diagnostics instead of being
    # masked by (or confused with) a much slower linker failure.
    - name: Check generated-data tables for drift
      run: make generated-data-check

    # The linker gate builds the full modern object/ELF/ROM chain, checks
    # deterministic memory budgets, rejects orphan/overflow/cross-overlay
    # errors, and verifies normal plus shifted boot/title behavior.
    # Per repository policy, CI ends after these target-ROM checks.
    - name: Build and verify modern target ROMs and linker
      run: |
        make expansion-modern-linker-check MODERN_CONFIG=debug MODERN_ABI=aapcs -j2
        make expansion-modern-linker-check MODERN_CONFIG=release MODERN_ABI=aapcs -j2

    # Issue #10 acceptance ("Boundary, serialization, and migration tests
    # gate CI"): runs the real, booted expansion ROM's item-ID-expansion
    # runtime probe (expansion-modern-itemexpansion-check, modern.mk) at an
    # expanded item cap (0xCE) for both configurations, immediately after
    # the default-cap linker-check step above and against the exact same
    # MODERN_OUTPUT_DIR it just populated. This is additive only: it does
    # not modify, reorder, or relax the linker-check step above, and it does
    # not touch any committed fingerprint/baseline.
    #
    # Why this is not stale: every modern C/data object depends on
    # modern.mk's content-addressed MODERN_COMPILE_SETTINGS stamp (which
    # embeds FE8_ITEM_ID_CAP/FE8_EXPANSION_ITEMTEST), so flipping those
    # variables here invalidates and rebuilds exactly the objects the new
    # cap affects instead of silently reusing the previous, default-cap
    # linker-check step's ELF/ROM. Running this bare (no env, plain
    # expansion-modern-linker-check) is deliberately kept a hard failure --
    # this step supplies the required FE8_ITEM_ID_CAP=0xCE
    # FE8_EXPANSION_ITEMTEST=1 pair itself, matching the actionable error
    # expansion-modern-itemexpansion-check prints when they are missing.
    - name: Boundary/serialization item-ID-expansion runtime gate (cap 0xCE)
      run: |
        FE8_ITEM_ID_CAP=0xCE FE8_EXPANSION_ITEMTEST=1 make expansion-modern-itemexpansion-check MODERN_CONFIG=debug   MODERN_ABI=aapcs -j2
        FE8_ITEM_ID_CAP=0xCE FE8_EXPANSION_ITEMTEST=1 make expansion-modern-itemexpansion-check MODERN_CONFIG=release MODERN_ABI=aapcs -j2
