name: Build CI

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  # Fast, host-only lane (issues #13 + #12/#15): exercises every
  # tools/gba-playtest host test -- scenario/schema parsing, generators,
  # config, save/migration fixtures, timeouts, retry policy, deterministic
  # sorted-JSON output, and provenance/diagnostics -- and the pure-stdlib
  # upstream-port review tooling suite (tests/upstream_port:
  # classify/scan/drift/state/ref-binding/output-safety/merge-commit and the
  # verify.gates() <-> build.yml mirror). Neither step needs the arm-none-eabi
  # cross-toolchain or a 16 MB ROM build. Only a native C compiler
  # (build-essential) and libmgba-dev are installed, since the one integration
  # test that actually drives libmGBA (test_backend_integration.py) compiles
  # its tiny backend for the *host*, never the GBA target; the upstream-port
  # tests are Python/stdlib only and link no C. This is intentionally a
  # separate job from `build` below so a scenario/generator/host-tooling
  # regression is reported in well under a minute, before paying for a full
  # ROM/linker build, and this lane never builds the ROM or runs the linker.
  # Both test steps are genuine gates (required status), not merely advisory.
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install host-only dependencies (no arm-none-eabi toolchain)
      run: sudo apt-get update && sudo apt-get install -y build-essential libmgba-dev

    # GBA_PLAYTEST_HOST_ONLY=1 is the single public switch that makes this a
    # genuinely host-only lane (tools/gba-playtest/tests/host_mode.py): every
    # ROM-dependent live-integration test skips explicitly, before it touches
    # any ROM/ELF/save artifact, instead of deciding live-vs-skip from whether
    # a git-ignored build artifact happens to exist. A clean CI checkout has
    # no ROM, so this job behaves identically here either way; the flag makes
    # that guarantee explicit and reproducible in a local worktree (and under
    # `python3 -m scripts.upstream_port verify --jobs 2`, where the ROM
    # `build` gates below rewrite exactly those artifacts while this gate
    # runs). The live/runtime coverage is owned by the `build` job below --
    # it is not weakened here. The env is inline on this one step only: the
    # `build` job must NOT inherit it, or its runtime gates would skip.
    - name: Run gba-playtest host test suite
      run: GBA_PLAYTEST_HOST_ONLY=1 python3 -m unittest discover -s tools/gba-playtest/tests -v

    # Issue #12/#15 upstream-port review tooling (scripts/upstream_port): 144
    # pure-stdlib unittest cases covering classify/scan/drift/state/
    # ref-binding/output-safety/merge-commit determinism and, crucially, the
    # verify.gates() <-> this-workflow argv/order mirror. Runs here in the
    # host lane (no arm-none-eabi toolchain, no ROM/linker rebuild) as an
    # explicit required gate; scripts/upstream_port/verify.py re-states these
    # same gate commands, argv-identical and in order, so `verify` reproduces
    # this CI locally without a runner.
    - name: Run upstream-port tooling test suite
      run: python3 -m unittest discover -s tests/upstream_port -v

  # Ubuntu libmGBA ROM/runtime gate: builds the full modern object/ELF/ROM
  # chain for both supported configs (debug, release; AAPCS only -- see
  # docs/config_identity.md), checks deterministic memory budgets, rejects
  # orphan/overflow/cross-overlay errors, and verifies boot/title/debugtools/
  # new-game/save-format/suspend-resume/shifted-link runtime behavior via
  # the same tools/gba-playtest harness the host-tests job unit-tests in
  # isolation, and finally re-runs that same harness at an expanded item ID
  # cap for the issue #10 item-ID-expansion runtime probe. This is the
  # exact (and only) supported CI host matrix today:
  # ubuntu-latest with arm-none-eabi GCC. macOS (Homebrew) is documented in
  # tools/gba-playtest/README.md for local development but is not exercised
  # by CI. The archival/decomp agbcc `fireemblem8.gba` path (see
  # docs/issue-resolution-policy.md "Supported modern path vs. archival
  # decomp path") continues to build locally and is unaffected by this
  # workflow, but it is not part of this or any CI gate and must never be
  # read as one. Per repository policy, CI ends after these target-ROM
  # checks.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    # Runs against the immutable commit CI is building (not the mutable
    # worktree/index) and before Install dependencies/Build tools create any
    # build output, so a prohibited tracked artifact fails fast on Git object
    # content instead of being masked by later build products.
    - name: Check tracked artifacts
      run: python3 scripts/artifact_guard.py --revision HEAD

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev gcc-arm-none-eabi libnewlib-arm-none-eabi libmgba-dev && python -m pip install ttp numpy pillow

    - name: Build tools
      run: ./build_tools.sh

    # Issue #15 closure: a bare `make`/`make all` must unconditionally
    # resolve to the modern release AAPCS boot-check chain, with the
    # archival agbcc lane reachable only by explicitly naming `make
    # legacy`/`make fireemblem8.gba` -- never via any environment variable
    # or `make` command-line variable override. These targeted tests are
    # stdlib `unittest` only (no pytest/network installs) and are dry-run/
    # database-probe based against the real Makefile/quickstart.sh (never a
    # real multi-minute compile/link/boot-check), so they run early and
    # fail fast on any structural regression before the slower linker gate
    # below.
    - name: Check default build lane and quickstart legacy glue (issue #15)
      run: |
        python3 -m unittest discover -s scripts/modernize/tests -p "test_build_default_lane.py" -v
        python3 -m unittest discover -s scripts/modernize/tests -p "test_quickstart.py" -v

    # Generated-data platform (Issue #5 Chapter 2 slice, Batch C): validates
    # every registered table's JSON source, cross-table references, the
    # whole-bundle chapter manifest, and committed inventory drift. Pure
    # Python/stdlib, no generated C is linked here -- runs once, before the
    # target-ROM linker gate below, so a stale/inconsistent data source
    # fails fast with actionable file:line diagnostics instead of being
    # masked by (or confused with) a much slower linker failure.
    - name: Check generated-data tables for drift
      run: make generated-data-check

    # The linker gate builds the full modern object/ELF/ROM chain, checks
    # deterministic memory budgets, rejects orphan/overflow/cross-overlay
    # errors, and verifies normal plus shifted boot/title behavior, plus
    # (issue #13) debugtools/new-game/save-format/suspend-resume runtime
    # scenarios and the relocation/raw-pointer/offset audits -- all reusing
    # this same modern object/ELF build for both configs rather than
    # rebuilding per check. This is the default-cap lane; the expanded-cap
    # issue #10 item-ID-expansion gate below is the final target-ROM step.
    - name: Build and verify modern target ROMs and linker
      run: |
        make expansion-modern-linker-check MODERN_CONFIG=debug MODERN_ABI=aapcs -j2
        make expansion-modern-linker-check MODERN_CONFIG=release MODERN_ABI=aapcs -j2

    # Issue #10 acceptance ("Boundary, serialization, and migration tests
    # gate CI"): runs the real, booted expansion ROM's item-ID-expansion
    # runtime probe (expansion-modern-itemexpansion-check, modern.mk) at an
    # expanded item cap (0xCE) for both configurations, immediately after
    # the default-cap linker-check step above and against the exact same
    # MODERN_OUTPUT_DIR it just populated. This is additive only: it does
    # not modify, reorder, or relax the linker-check step above, and it does
    # not touch any committed fingerprint/baseline.
    #
    # Issue #6 (Sprint 2) rides this SAME step and this SAME ROM build: the
    # EXPANSION_STARTER_CONTENT=1 EXPANSION_MECHANICS_HOOKS=1
    # EXPANSION_MECHANICS_SAMPLE=1 profile links the bundled generated-data
    # content example, so the one probe run additionally asserts the authored
    # item record (original name/description/uses/type/attributes/icon) and
    # the content mechanic registered through the public hook registry. No
    # extra workflow command and no extra ROM build: the CI correctness
    # command count stays exactly 10.
    #
    # Why this is not stale: every modern C/data object depends on
    # modern.mk's content-addressed MODERN_COMPILE_SETTINGS stamp (which
    # embeds FE8_ITEM_ID_CAP/FE8_EXPANSION_ITEMTEST), so flipping those
    # variables here invalidates and rebuilds exactly the objects the new
    # cap affects instead of silently reusing the previous, default-cap
    # linker-check step's ELF/ROM. Running this bare (no env, plain
    # expansion-modern-linker-check) is deliberately kept a hard failure --
    # this step supplies the required FE8_ITEM_ID_CAP=0xCE
    # FE8_EXPANSION_ITEMTEST=1 pair itself, matching the actionable error
    # expansion-modern-itemexpansion-check prints when they are missing.
    #
    # This is the workflow final step: per repository policy, CI ends after
    # these target-ROM checks.
    - name: Boundary/serialization item-ID-expansion + content runtime gate (cap 0xCE)
      run: |
        FE8_ITEM_ID_CAP=0xCE FE8_EXPANSION_ITEMTEST=1 make expansion-modern-itemexpansion-check MODERN_CONFIG=debug   MODERN_ABI=aapcs EXPANSION_STARTER_CONTENT=1 EXPANSION_MECHANICS_HOOKS=1 EXPANSION_MECHANICS_SAMPLE=1 -j2
        FE8_ITEM_ID_CAP=0xCE FE8_EXPANSION_ITEMTEST=1 make expansion-modern-itemexpansion-check MODERN_CONFIG=release MODERN_ABI=aapcs EXPANSION_STARTER_CONTENT=1 EXPANSION_MECHANICS_HOOKS=1 EXPANSION_MECHANICS_SAMPLE=1 -j2
